name: JS Build & Test

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.package }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        package: [vite-plugin-ruby, vite-plugin-rails]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version: ${{ matrix.node }}

      - run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm -r build

      - name: Test
        run: pnpm -C ${{ matrix.package }} test --run

      # TEMPORARY: capture vite-plugin-rails/example build output for cross-platform
      # hash-drift diagnosis. Remove once root cause is identified.
      - name: Upload example build (diagnostic)
        if: matrix.package == 'vite-plugin-rails' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: vite-plugin-rails-example-linux
          path: vite-plugin-rails/example/public/vite/
          if-no-files-found: error
          retention-days: 1
